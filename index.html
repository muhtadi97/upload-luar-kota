<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFM Medan</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/814/814848.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3ecf8e; --primary-hover: #36b87d; --danger: #ef4444; --bg: #f1f5f9; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; background-color: var(--bg); color: #1e293b; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; color: #0f172a; }
        
        .upload-card {
            background: var(--card-bg); padding: 25px; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center;
            max-width: 400px; margin: 0 auto 30px auto; border: 2px dashed #cbd5e1;
        }

        #progressArea { display: none; margin: 20px 0; text-align: left; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 8px; }
        .progress-container { width: 100%; background: #e2e8f0; border-radius: 10px; height: 14px; overflow: hidden; }
        .progress-bar { 
            width: 0%; height: 100%; background: var(--primary); 
            transition: width 0.1s linear; /* Lebih responsif */
            box-shadow: 0 0 10px rgba(62, 207, 142, 0.4);
        }

        input[type="file"] { display: block; width: 100%; margin: 0 auto 15px auto; font-size: 0.8rem; color: #64748b; }
        button { 
            display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px; 
            background: var(--primary); color: white; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 700; transition: 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        .list-card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 0.75rem; color: #64748b; border-bottom: 1px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        .col-name { width: 50%; } .col-date { width: 35%; } .col-action { width: 15%; text-align: center; }
        .file-name { font-weight: 600; color: #334155; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { font-size: 0.75rem; color: #94a3b8; }
        .btn-action { background: none; color: #64748b; padding: 6px; border-radius: 6px; transition: 0.2s; cursor: pointer; border:none;}
        .btn-action:hover { color: var(--primary); background: #f0fff4; }
        .btn-delete:hover { color: var(--danger); background: #fef2f2; }
        #status { font-size: 0.85rem; margin-top: 10px; font-weight: 700; }

        @media (max-width: 600px) { .col-name { width: 45%; } .col-date { width: 40%; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i data-lucide="shield-check"></i> Dua Farma Cabang Medan</h2>
    </div>

    <div class="upload-card">
        <h4><i data-lucide="upload-cloud" style="width:18px"></i> Kirim File (Max 50MB)</h4>
        <input type="file" id="fileInput">
        
        <div id="progressArea">
            <div class="progress-info">
                <span>Mengirim...</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <button id="uploadBtn" onclick="handleUpload()">
            <i data-lucide="send"></i> Mulai Upload
        </button>
        <p id="status"></p>
    </div>

    <div class="list-card">
        <table>
            <thead>
                <tr><th class="col-name">Nama File</th><th class="col-date">Waktu Upload</th><th class="col-action">Aksi</th></tr>
            </thead>
            <tbody id="fileList">
                <tr><td colspan="3" style="text-align:center">Menghubungkan ke database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://fxkxlvbopaqodsnehhey.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qPBvak74R9PX4pbgWgCJ1w_1wy5qXXo';
    const bucketName = 'uploads';
    const MASTER_PASS = 'duamedan';

    function formatSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + ' ' + ['Bytes', 'KB', 'MB', 'GB'][i];
    }

    async function listFiles() {
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await supabaseClient.storage.from(bucketName).list('', {
            sortBy: { column: 'created_at', order: 'desc' }
        });
        
        const listContainer = document.getElementById('fileList');
        if (error) {
            listContainer.innerHTML = '<tr><td colspan="3" style="text-align:center">Gagal memuat data.</td></tr>';
            return;
        }

        listContainer.innerHTML = data.length === 0 ? '<tr><td colspan="3" style="text-align:center">Tidak ada file.</td></tr>' : '';
        data.forEach(file => {
            if (file.name === '.emptyFolderPlaceholder') return;
            const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${bucketName}/${file.name}`;
            const dateStr = new Date(file.created_at).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
            
            listContainer.innerHTML += `
                <tr>
                    <td class="col-name"><span class="file-name">${file.name}</span><span class="file-size">${formatSize(file.metadata.size)}</span></td>
                    <td class="col-date" style="color:#64748b">${dateStr}</td>
                    <td class="col-action">
                        <div style="display:flex; justify-content:center; gap:8px">
                            <a href="${publicUrl}" target="_blank" class="btn-action"><i data-lucide="download" style="width:16px"></i></a>
                            <button class="btn-action btn-delete" onclick="handleDelete('${file.name}')"><i data-lucide="trash-2" style="width:16px"></i></button>
                        </div>
                    </td>
                </tr>`;
        });
        lucide.createIcons();
    }

    function handleUpload() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) return alert("Pilih file dulu!");

        const file = fileInput.files[0];
        if (file.size > 50 * 1024 * 1024) return alert("Batas maksimal 50MB!");

        const pass = prompt("Password Upload:");
        if (pass !== MASTER_PASS) return alert("Password Salah!");

        const btn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const progArea = document.getElementById('progressArea');
        const progBar = document.getElementById('progressBar');
        const percText = document.getElementById('percentText');
        const fileName = `${Date.now()}-${file.name}`;

        btn.disabled = true;
        status.innerText = "";
        progArea.style.display = "block";
        progBar.style.width = "0%";
        percText.innerText = "0%";

        // GUNAKAN XHR MANUAL UNTUK MONITOR PROGRESS YANG AKURAT
        const xhr = new XMLHttpRequest();
        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${bucketName}/${fileName}`;

        xhr.upload.addEventListener("progress", (event) => {
            if (event.lengthComputable) {
                const percent = Math.round((event.loaded / event.total) * 100);
                progBar.style.width = percent + "%";
                percText.innerText = percent + "%";
            }
        });

        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200 || xhr.status === 201) {
                    status.innerText = "✅ Berhasil Diunggah!";
                    status.style.color = "green";
                    fileInput.value = '';
                    listFiles();
                } else {
                    alert("Gagal: " + xhr.statusText);
                    status.innerText = "❌ Gagal";
                }
                
                setTimeout(() => {
                    progArea.style.display = "none";
                    status.innerText = "";
                    btn.disabled = false;
                }, 3000);
            }
        };

        xhr.open("POST", uploadUrl, true);
        xhr.setRequestHeader("Authorization", `Bearer ${SUPABASE_KEY}`);
        xhr.setRequestHeader("apikey", SUPABASE_KEY);
        xhr.send(file);
    }

    async function handleDelete(name) {
        const pass = prompt("Password Hapus:");
        if (pass !== MASTER_PASS) return alert("Password Salah!");
        if (confirm("Hapus file ini?")) {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            await supabaseClient.storage.from(bucketName).remove([name]);
            listFiles();
        }
    }

    lucide.createIcons();
    listFiles();
</script>
</body>
</html>
